name: Market Ingestion

on:
  workflow_dispatch:
  schedule:
    # 16:30 IST, Monday-Friday
    - cron: "0 11 * * 1-5"

jobs:
  ingest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run market ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "from app.infrastructure.scheduler.worker import run_once; print(run_once())"