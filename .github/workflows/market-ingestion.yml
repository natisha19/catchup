name: Market Ingestion

on:
  workflow_dispatch:

  schedule:
    # 09:15 IST — market open
    - cron: "45 3 * * 1-5"

    # Every 15 minutes from 09:30 to 15:15 IST
    - cron: "*/15 4-9 * * 1-5"

    # 15:30 IST — final market tick
    - cron: "0 10 * * 1-5"

jobs:
  ingest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "from app.infrastructure.scheduler.worker import run_once; run_once()"